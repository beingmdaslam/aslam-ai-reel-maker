
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aslam AI Movie Dubbing Studio</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d18;color:white;
 font-family:Arial,sans-serif;padding:20px;
}
.container{max-width:650px;margin:auto}
h1{color:#48d9ff;text-align:center;font-size:27px}
.subtitle{text-align:center;color:#aaa}
.card{
 background:#141e30;padding:20px;border-radius:16px;
 margin-top:20px;border:1px solid #263751;
}
button,select{
 width:100%;padding:15px;border-radius:10px;
 border:0;font-size:16px;margin-top:12px;
}
button{
 background:#08b9dc;color:#00111a;
 font-weight:bold;cursor:pointer;
}
select{background:#25334a;color:white}
input[type=file]{display:none}
video{width:100%;margin-top:15px;border-radius:12px}
.status{color:#49e6a5;text-align:center;margin-top:12px}
.small{color:#aaa;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="container">

<h1>🎬 ASLAM AI</h1>
<p class="subtitle">Movie Dubbing Studio</p>

<div class="card">
<h2>Upload Your Movie</h2>
<p>Select your movie or video from your phone.</p>

<input
 type="file"
 id="videoFile"
 accept="video/*"
>

<button type="button" id="uploadBtn">
📁 SELECT VIDEO
</button>

<p id="fileName" class="status">No video selected</p>

<video id="preview" controls playsinline style="display:none"></video>
</div>

<div class="card">
<h2>🌍 Dubbing Settings</h2>

<label>Target Language</label>
<select id="language">
<option>Hindi</option>
<option>English</option>
<option>Arabic</option>
<option>Urdu</option>
<option>French</option>
<option>Spanish</option>
<option>German</option>
<option>Chinese</option>
<option>Japanese</option>
<option>Bengali</option>
<option>Turkish</option>
<option>Portuguese</option>
</select>

<label>Video Quality</label>
<select id="quality">
<option>1080p HD</option>
<option>4K Ultra HD</option>
</select>

<button type="button" id="startBtn">START DUBBING</button>
<p class="small" id="message">
AI processing backend is not connected yet.
</p>
</div>

</div>

<script>
const uploadBtn = document.getElementById("uploadBtn");
const videoFile = document.getElementById("videoFile");
const preview = document.getElementById("preview");
const fileName = document.getElementById("fileName");

uploadBtn.addEventListener("click", function() {
 videoFile.click();
});

videoFile.addEventListener("change", function() {
 const file = this.files[0];

 if (!file) return;

 if (!file.type.startsWith("video/")) {
   fileName.textContent = "Please select a video file.";
   return;
 }

 preview.src = URL.createObjectURL(file);
 preview.style.display = "block";
 fileName.textContent = "Selected: " + file.name;
});

document.getElementById("startBtn").addEventListener("click", function() {
 if (!videoFile.files.length) {
   alert("Please select a video first.");
   return;
 }
 alert("Video selected successfully. AI processing backend is not connected yet.");
});
</script>
</body>
</html>
